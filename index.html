<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CIVIL TOXIC SHOOTING GAME</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ac5d4;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:3}
.panel{background:#101c20dd;color:white;border:2px solid #70ff9a;border-radius:14px;padding:12px;font-size:17px;line-height:1.45}
#healthbar{height:12px;width:155px;background:#6d2929;margin-top:5px}
#healthfill{height:100%;width:100%;background:#40f878}
#controls{position:fixed;bottom:24px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-end;z-index:4}
#stick{width:145px;height:145px;border:4px solid #ffffff99;border-radius:50%;background:#253a3599;position:relative}
#knob{width:54px;height:54px;border:3px solid white;border-radius:50%;background:#a6d8b5;position:absolute;left:41px;top:41px}
button{font-size:17px;font-weight:bold;color:white;border:3px solid #caffd8;background:#142820ee;border-radius:22px;padding:20px 22px;touch-action:none}
#fire{background:#c52b2b;width:112px;height:112px;border-radius:50%;margin-top:18px}
#reload{min-width:140px}
#rightcontrols{display:flex;flex-direction:column;align-items:center;gap:10px}
#cross{position:fixed;left:50%;top:53%;transform:translate(-50%,-50%);font-size:36px;color:white;text-shadow:0 0 4px black;pointer-events:none;z-index:2}
#hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);color:white;background:#0009;padding:7px 10px;border-radius:10px;font-size:12px;z-index:3;pointer-events:none}
#overlay{position:fixed;inset:0;background:#03120ff0;color:white;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:10}
#overlay h1{color:#68ff8d;font-size:36px}
#overlay button{background:#14833a;font-size:23px}
@media(min-width:700px){.panel{font-size:22px}#stick{width:160px;height:160px}}
</style>
</head>
<body>
<div id="hud">
  <div class="panel">☠ CIVIL TOXIC<br>HEALTH <span id="hp">200</span><div id="healthbar"><div id="healthfill"></div></div></div>
  <div class="panel">AMMO: <span id="ammo">30</span><br>ENEMIES: <span id="enemies">8</span><br>KILLS: <span id="kills">0</span></div>
</div>
<div id="hint">Left joystick: move • Drag screen: aim • FIRE: shoot</div>
<div id="cross">+</div>
<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div id="rightcontrols">
    <button id="reload">↻ RELOAD</button>
    <button id="fire">FIRE 🔥</button>
  </div>
</div>
<div id="overlay">
  <h1 id="result">GAME OVER</h1>
  <p id="message">YOU WERE ELIMINATED</p>
  <p>KILLS: <span id="finalkills">0</span></p>
  <button id="again">↻ PLAY AGAIN</button>
  <p>CIVIL TOXIC SHOOTING GAME</p>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ac5d4);
scene.fog=new THREE.Fog(0x9ac5d4,55,145);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x647b4c,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-20,35,15);
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:1});
const grass=mat(0x638553),roadmat=mat(0x565b59),wall=mat(0x77796b),
roofmat=mat(0x383f3b),windowmat=mat(0x263e43),green=mat(0x167e43),
skin=mat(0xe4b183),black=mat(0x171b19),red=mat(0xc52c2c),
yellow=mat(0xffd34e),white=mat(0xffffff);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),grass);
ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);

function box(x,y,z,sx,sy,sz,material){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 o.position.set(x,y,z);scene.add(o);return o;
}
box(0,0,-12,14,.04,180,roadmat);
box(0,0,0,180,.04,13,roadmat);

function building(x,z,w=9,d=8){
 box(x,1.6,z,w,3.2,d,wall);
 box(x,3.35,z,w+.5,.35,d+.5,roofmat);
 for(let side of [-1,1]){
  box(x+side*w*.27,1.7,z-d/2-.025,1.1,1.1,.06,windowmat);
 }
}
building(-13,-8,9,8);
building(15,-21,11,9);
building(-21,-36,10,10);
building(23,-49,12,10);
building(-6,-57,10,9);
building(35,3,9,8);

function tree(x,z){
 const trunk=mat(0x67452b),leaves=mat(0x176d37);
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2.2,6),trunk);
 t.position.set(x,1,z);scene.add(t);
 const l=new THREE.Mesh(new THREE.ConeGeometry(1.8,4,6),leaves);
 l.position.set(x,3.4,z);scene.add(l);
}
for(let i=0;i<30;i++){
 let x=(Math.random()-.5)*100,z=-Math.random()*100;
 if(Math.abs(x)>10)tree(x,z);
}

function makeCharacter(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.95,4,8),mat(color));
 body.position.y=1.15;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.39,8,6),skin);
 head.position.y=2.05;g.add(head);
 const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,1.15),black);
 gun.position.set(.42,1.35,-.75);g.add(gun);
 const arm=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.75),mat(color));
 arm.position.set(.38,1.38,-.3);g.add(arm);
 scene.add(g);return g;
}

let player,enemies=[],bullets=[],enemyBullets=[];
let health=200,ammo=30,kills=0,gameover=false,reloading=false;
let yaw=0,pitch=0;
const clock=new THREE.Clock();
const hpEl=document.querySelector('#hp'),fill=document.querySelector('#healthfill');
const ammoEl=document.querySelector('#ammo'),enemyEl=document.querySelector('#enemies');
const killsEl=document.querySelector('#kills');

function reset(){
 for(const e of enemies)scene.remove(e.mesh);
 for(const b of bullets)scene.remove(b.mesh);
 for(const b of enemyBullets)scene.remove(b.mesh);
 enemies=[];bullets=[];enemyBullets=[];
 if(player)scene.remove(player);
 health=200;ammo=30;kills=0;gameover=false;reloading=false;
 yaw=0;pitch=0;
 player=makeCharacter(0x168349);
 player.position.set(0,0,5);
 for(let i=0;i<8;i++){
  const mesh=makeCharacter(0xb13a34);
  mesh.scale.set(.9,.9,.9);
  mesh.position.set((Math.random()-.5)*34,0,-15-Math.random()*55);
  enemies.push({mesh,hp:100,shoot:1+Math.random()*2,speed:1.1+Math.random()*.6});
 }
 document.querySelector('#overlay').style.display='none';
 updateHUD();
}
function updateHUD(){
 hpEl.textContent=Math.max(0,Math.ceil(health));
 fill.style.width=Math.max(0,health/200*100)+'%';
 ammoEl.textContent=ammo;
 enemyEl.textContent=enemies.length;
 killsEl.textContent=kills;
}
function endGame(win){
 if(gameover)return;
 gameover=true;
 document.querySelector('#result').textContent=win?'🏆 VICTORY!':'☠ GAME OVER';
 document.querySelector('#message').textContent=win?'ALL ENEMIES ELIMINATED':'YOU WERE ELIMINATED';
 document.querySelector('#finalkills').textContent=kills;
 document.querySelector('#overlay').style.display='flex';
}
function makeBullet(position,direction,owner){
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.11,6,5),owner==='player'?yellow:red);
 mesh.position.copy(position);scene.add(mesh);
 (owner==='player'?bullets:enemyBullets).push({mesh,dir:direction.clone(),life:2.5,owner});
}
function shoot(){
 if(gameover||ammo<=0||reloading)return;
 ammo--;updateHUD();
 const direction=new THREE.Vector3(-Math.sin(yaw),Math.sin(pitch),-Math.cos(yaw)).normalize();
 const origin=player.position.clone().add(new THREE.Vector3(0,1.45,0));
 origin.addScaledVector(direction,.8);
 makeBullet(origin,direction,'player');
}
function reload(){
 if(gameover||reloading||ammo===30)return;
 reloading=true;
 document.querySelector('#reload').textContent='RELOADING...';
 setTimeout(()=>{
  if(!gameover){ammo=30;updateHUD();}
  reloading=false;document.querySelector('#reload').textContent='↻ RELOAD';
 },1200);
}
document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
document.querySelector('#reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()});
document.querySelector('#again').addEventListener('click',reset);

let joyX=0,joyY=0,joyActive=false;
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
function joy(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=r.width*.34,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joyX=dx/max;joyY=dy/max;
 knob.style.left=(r.width/2-27+dx)+'px';
 knob.style.top=(r.height/2-27+dy)+'px';
}
stick.addEventListener('pointerdown',e=>{joyActive=true;stick.setPointerCapture(e.pointerId);joy(e)});
stick.addEventListener('pointermove',e=>{if(joyActive)joy(e)});
function endJoy(){joyActive=false;joyX=joyY=0;knob.style.left='41px';knob.style.top='41px'}
stick.addEventListener('pointerup',endJoy);
stick.addEventListener('pointercancel',endJoy);

let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX<innerWidth*.38&&e.clientY>innerHeight*.65)return;
 dragging=true;lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 lastX=e.clientX;lastY=e.clientY;
 yaw-=dx*.006;
 pitch=Math.max(-.5,Math.min(.5,pitch-dy*.004));
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

function update(dt){
 if(gameover)return;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 player.position.addScaledVector(forward,-joyY*7*dt);
 player.position.addScaledVector(right,joyX*7*dt);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-90,30);
 player.rotation.y=yaw;

 const target=player.position.clone().add(new THREE.Vector3(0,1.6,0));
 const camBack=new THREE.Vector3(Math.sin(yaw)*6,3.1,Math.cos(yaw)*6);
 camera.position.copy(target).add(camBack);
 camera.lookAt(target.clone().add(new THREE.Vector3(-Math.sin(yaw)*10, pitch*7-1,-Math.cos(yaw)*10)));

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i],m=e.mesh;
  const dx=player.position.x-m.position.x,dz=player.position.z-m.position.z;
  const dist=Math.hypot(dx,dz);
  if(dist>2.5){
   m.position.x+=dx/dist*e.speed*dt;
   m.position.z+=dz/dist*e.speed*dt;
  }else{
   e.shoot-=dt;
   if(e.shoot<=0){
    e.shoot=1.8+Math.random()*1.2;
    // Enemy damage is intentionally low.
    health=Math.max(0,health-5);
    updateHUD();
    if(health<=0){endGame(false);return;}
   }
  }
  m.rotation.y=Math.atan2(-dx,-dz);
 }
 moveBullets(bullets,dt);
 moveBullets(enemyBullets,dt);
 updateHUD();
 if(enemies.length===0)endGame(true);
}
function moveBullets(list,dt){
 for(let i=list.length-1;i>=0;i--){
  const b=list[i];
  b.mesh.position.addScaledVector(b.dir,35*dt);
  b.life-=dt;
  let hit=false;
  if(b.owner==='player'){
   for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    if(b.mesh.position.distanceTo(e.mesh.position.clone().add(new THREE.Vector3(0,1,0)))<1.15){
     e.hp-=50;hit=true;
     if(e.hp<=0){
      scene.remove(e.mesh);enemies.splice(j,1);kills++;
     }
     break;
    }
   }
  }else{
   if(b.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,1,0)))<1.1){
    health=Math.max(0,health-5);hit=true;
    if(health<=0)endGame(false);
   }
  }
  if(hit||b.life<=0){
   scene.remove(b.mesh);list.splice(i,1);
  }
 }
}
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
});
reset();
loop();
</script>
</body>
 </html>
