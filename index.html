<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CIVIL TOXIC SHOOTING GAME</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:8px;left:8px;background:#000b;padding:10px;border-radius:10px;z-index:2;font-size:13px}
#stats{position:fixed;top:8px;right:8px;background:#000b;padding:10px;border-radius:10px;z-index:2;text-align:right;font-size:13px}
#start{position:fixed;inset:0;z-index:10;background:#111e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#start h1{color:#ff4b4b}
#start button{font-size:22px;padding:15px 35px;background:#c00;color:white;border:0;border-radius:12px}
#status{font-size:13px;color:#ffe082;max-width:90%;overflow-wrap:anywhere}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;pointer-events:none}
#stick{position:fixed;left:22px;bottom:30px;width:115px;height:115px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff88;z-index:3;touch-action:none}
#knob{position:absolute;left:33px;top:33px;width:45px;height:45px;border-radius:50%;background:#ffffff99}
.btn{position:fixed;z-index:3;color:white;background:#151515cc;border:1px solid #aaa;border-radius:12px;padding:15px 10px;font-weight:bold;touch-action:manipulation}
#fire{right:20px;bottom:65px;width:82px;height:82px;border-radius:50%;background:#b90000}
#reload{right:115px;bottom:110px}
#jump{right:115px;bottom:40px}
#med{right:20px;bottom:165px}
#crouch{right:115px;bottom:180px}
#message{position:fixed;top:43%;width:100%;text-align:center;font-size:24px;font-weight:bold;pointer-events:none;z-index:4}
</style>
</head>
<body>

<div id="hud">
  <b>CIVIL TOXIC</b><br>
  ❤️ <span id="hp">100</span> HP<br>
  🔫 <span id="ammo">30</span>/<span id="reserve">120</span>
</div>

<div id="stats">
  KILLS: <span id="kills">0</span><br>
  ENEMIES: <span id="remaining">6</span>
</div>

<div id="crosshair">+</div>
<div id="message"></div>

<div id="stick"><div id="knob"></div></div>
<button class="btn" id="fire">FIRE</button>
<button class="btn" id="reload">RELOAD</button>
<button class="btn" id="jump">JUMP</button>
<button class="btn" id="med">MEDKIT</button>
<button class="btn" id="crouch">CROUCH</button>

<div id="start">
  <h1>CIVIL TOXIC<br>SHOOTING GAME</h1>
  <p>3D SOLDIER COMBAT</p>
  <p>Move: joystick | Look: drag screen | Shoot: FIRE</p>
  <button id="play">PLAY GAME</button>
  <p id="status">Game ready. Press PLAY GAME.</p>
</div>

<script type="module">
const statusEl=document.getElementById('status');
const startScreen=document.getElementById('start');
const messageEl=document.getElementById('message');

let started=false;
let scene,camera,renderer,THREE;
let player,soldier=null;
let enemies=[];
let health=100,ammo=30,reserve=120,kills=0,medkits=3;
let moveX=0,moveY=0,yaw=0,pitch=0;
let firing=false,crouching=false,jumping=false;
let jumpVelocity=0,lastShot=0;

function message(text){
  messageEl.textContent=text;
  if(text)setTimeout(()=>{
    if(messageEl.textContent===text)messageEl.textContent='';
  },1300);
}

function hud(){
  document.getElementById('hp').textContent=Math.ceil(health);
  document.getElementById('ammo').textContent=ammo;
  document.getElementById('reserve').textContent=reserve;
  document.getElementById('kills').textContent=kills;
  document.getElementById('remaining').textContent=
    enemies.filter(e=>e.alive).length;
}

function makeMaterial(color){
  return new THREE.MeshStandardMaterial({color});
}

function addBox(x,y,z,w,h,d,color,parent=scene){
  const obj=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),makeMaterial(color)
  );
  obj.position.set(x,y,z);
  parent.add(obj);
  return obj;
}

function createMap(){
  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(180,180),
    makeMaterial(0x647451)
  );
  ground.rotation.x=-Math.PI/2;
  scene.add(ground);

  addBox(0,0.02,0,8,0.04,180,0x414141);
  addBox(0,0.03,0,180,0.04,8,0x414141);

  for(let i=0;i<22;i++){
    const x=(Math.random()-.5)*120;
    const z=(Math.random()-.5)*120;
    if(Math.abs(x)<12||Math.abs(z)<12)continue;
    const w=5+Math.random()*5,h=3+Math.random()*4,d=5+Math.random()*5;
    addBox(x,h/2,z,w,h,d,0x8b887b);
    addBox(x,h+0.1,z,w+.2,.2,d+.2,0x4d4b48);
  }

  for(let i=0;i<45;i++){
    const x=(Math.random()-.5)*150;
    const z=(Math.random()-.5)*150;
    const trunk=new THREE.Mesh(
      new THREE.CylinderGeometry(.15,.22,1.5,5),
      makeMaterial(0x62432b)
    );
    trunk.position.set(x,.75,z);
    scene.add(trunk);
    const leaves=new THREE.Mesh(
      new THREE.ConeGeometry(1.25,2.8,6),
      makeMaterial(0x315b32)
    );
    leaves.position.set(x,2.5,z);
    scene.add(leaves);
  }
}

function createPlayer(){
  player=new THREE.Group();
  scene.add(player);
  player.position.set(0,0,5);

  // Temporary visible soldier if GLB does not load
  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.38,.8,4,8),
    makeMaterial(0x657047)
  );
  body.position.y=1.15;
  player.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.24,10,8),
    makeMaterial(0xb98765)
  );
  head.position.y=1.9;
  player.add(head);

  addBox(.35,1.35,-.4,.14,.14,.8,0x202020,player);
}

function loadSoldier(){
  statusEl.textContent='Loading soldier model...';

  import('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js')
  .then(({GLTFLoader})=>{
    const loader=new GLTFLoader();

    const url='https://raw.githubusercontent.com/deepanshusaini9666-bot/civil-toxic-shooting-game/main/aiprintgen_Realistic%20Armored%20Soldier%20Character%20Model%20-%20Rigged-preview.glb';

    loader.load(url,gltf=>{
      if(soldier&&player)player.remove(soldier);

      soldier=gltf.scene;
      const bounds=new THREE.Box3().setFromObject(soldier);
      const size=bounds.getSize(new THREE.Vector3());

      if(size.y>0)soldier.scale.setScalar(2/size.y);

      soldier.updateMatrixWorld(true);
      const b=new THREE.Box3().setFromObject(soldier);
      const c=b.getCenter(new THREE.Vector3());

      soldier.position.x-=c.x;
      soldier.position.z-=c.z;
      soldier.position.y-=b.min.y;

      player.add(soldier);
      statusEl.textContent='Soldier loaded successfully!';
    },undefined,error=>{
      console.error(error);
      statusEl.textContent='Soldier file failed. Using temporary soldier.';
    });
  })
  .catch(error=>{
    console.error(error);
    statusEl.textContent='Soldier loader failed. Using temporary soldier.';
  });
}

function createEnemy(x,z){
  const group=new THREE.Group();
  group.position.set(x,0,z);
  scene.add(group);

  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.35,.7,3,6),
    makeMaterial(0x9d3028)
  );
  body.position.y=1.05;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.22,8,6),
    makeMaterial(0xb58a69)
  );
  head.position.y=1.8;
  group.add(head);

  enemies.push({group,alive:true,hp:100,cooldown:0});
}

function setupEnemies(){
  for(let i=0;i<6;i++){
    let x,z;
    do{
      x=(Math.random()-.5)*60;
      z=(Math.random()-.5)*60;
    }while(Math.hypot(x,z)<14);
    createEnemy(x,z);
  }
}

function updateCamera(){
  if(!camera||!player)return;
  camera.position.set(
    player.position.x+Math.sin(yaw)*5,
    player.position.y+(crouching?2.5:3.2)+Math.sin(pitch),
    player.position.z+Math.cos(yaw)*5
  );
  camera.lookAt(
    player.position.x,
    player.position.y+(crouching?1:1.5),
    player.position.z
  );
}

function shoot(){
  if(!started||health<=0)return;
  if(ammo<=0){message('RELOAD!');return}
  ammo--;
  hud();

  const ray=new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(0,0),camera);
  const objects=[];
  enemies.filter(e=>e.alive).forEach(e=>{
    e.group.traverse(o=>{if(o.isMesh)objects.push(o)});
  });

  const hits=ray.intersectObjects(objects,false);
  if(hits.length){
    const target=enemies.find(e=>{
      let found=false;
      e.group.traverse(o=>{if(o===hits[0].object)found=true});
      return found;
    });
    if(target){
      target.hp-=34;
      if(target.hp<=0){
        target.alive=false;
        scene.remove(target.group);
        kills++;
        message('ENEMY ELIMINATED');
        hud();
      }
    }
  }
}

function reload(){
  if(ammo>=30||reserve<=0)return;
  message('RELOADING...');
  setTimeout(()=>{
    const n=Math.min(30-ammo,reserve);
    ammo+=n;reserve-=n;hud();
  },1000);
}

function startGame(){
  if(started)return;
  started=true;
  startScreen.style.display='none';
  message('GAME STARTED!');
  statusEl.textContent='Game running';
}

document.getElementById('play').addEventListener('click',startGame);

document.getElementById('fire').addEventListener('pointerdown',e=>{
  e.preventDefault();firing=true;shoot();
});
['pointerup','pointercancel','pointerleave'].forEach(type=>{
  document.getElementById('fire').addEventListener(type,()=>firing=false);
});

document.getElementById('reload').addEventListener('click',reload);

document.getElementById('jump').addEventListener('click',()=>{
  if(!jumping){jumping=true;jumpVelocity=5}
});

document.getElementById('crouch').addEventListener('click',()=>{
  crouching=!crouching;
  document.getElementById('crouch').textContent=crouching?'STAND':'CROUCH';
});

document.getElementById('med').addEventListener('click',()=>{
  if(medkits>0&&health<100){
    medkits--;
    health=Math.min(100,health+40);
    hud();message('MEDKIT USED');
  }
});

/* Joystick */

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickPointer=null;

stick.addEventListener('pointerdown',e=>{
  e.preventDefault();
  stickPointer=e.pointerId;
  stick.setPointerCapture(e.pointerId);
  moveStick(e);
});

stick.addEventListener('pointermove',e=>{
  if(e.pointerId===stickPointer)moveStick(e);
});

function moveStick(e){
  const r=stick.getBoundingClientRect();
  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);
  const max=34,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  moveX=dx/max;moveY=dy/max;
  knob.style.left=(33+dx)+'px';
  knob.style.top=(33+dy)+'px';
}

function releaseStick(){
  stickPointer=null;moveX=0;moveY=0;
  knob.style.left='33px';knob.style.top='33px';
}
stick.addEventListener('pointerup',releaseStick);
stick.addEventListener('pointercancel',releaseStick);

/* Camera drag */

let looking=false,lastX=0,lastY=0;
rendererSafeListeners();

function rendererSafeListeners(){
  document.addEventListener('pointerdown',e=>{
    if(e.clientX>innerWidth*.38&&
       !e.target.closest('button')&&
       !e.target.closest('#stick')){
      looking=true;lastX=e.clientX;lastY=e.clientY;
    }
  });
  document.addEventListener('pointermove',e=>{
    if(!looking)return;
    yaw-=(e.clientX-lastX)*.006;
    pitch=Math.max(-.5,Math.min(.5,pitch+(e.clientY-lastY)*.003));
    lastX=e.clientX;lastY=e.clientY;
  });
  document.addEventListener('pointerup',()=>looking=false);
  document.addEventListener('pointercancel',()=>looking=false);
}

function animate(){
  requestAnimationFrame(animate);
  if(!renderer||!scene||!camera)return;

  const dt=.016;

  if(started&&health>0){
    const speed=crouching?2:4;
    player.position.x+=(-Math.sin(yaw)*(-moveY)+Math.cos(yaw)*moveX)*speed*dt;
    player.position.z+=(-Math.cos(yaw)*(-moveY)-Math.sin(yaw)*moveX)*speed*dt;
    player.position.x=THREE.MathUtils.clamp(player.position.x,-85,85);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-85,85);

    if(jumping){
      player.position.y+=jumpVelocity*dt;
      jumpVelocity-=12*dt;
      if(player.position.y<=0){
        player.position.y=0;jumping=false;jumpVelocity=0;
      }
    }

    for(const e of enemies){
      if(!e.alive)continue;
      const dx=player.position.x-e.group.position.x;
      const dz=player.position.z-e.group.position.z;
      const d=Math.hypot(dx,dz);
      if(d>2){
        e.group.position.x+=dx/d*dt;
        e.group.position.z+=dz/d*dt;
      }else{
        e.cooldown-=dt;
        if(e.cooldown<=0){
          health=Math.max(0,health-5);
          e.cooldown=1;
          hud();
        }
      }
    }

    const now=performance.now();
    if(firing&&now-lastShot>250){
      lastShot=now;shoot();
    }
    hud();
    if(health<=0)message('GAME OVER');
  }

  updateCamera();
  renderer.render(scene,camera);
}

async function init(){
  try{
    statusEl.textContent='Loading 3D engine...';

    const THREE_MODULE=await import(
      'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'
    );
    THREE=THREE_MODULE;

    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x8bb4cb);
    scene.fog=new THREE.Fog(0x8bb4cb,45,150);

    camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,250);

    renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    document.body.insertBefore(renderer.domElement,document.body.firstChild);

    scene.add(new THREE.HemisphereLight(0xffffff,0x46533c,2));
    const light=new THREE.DirectionalLight(0xffffff,2);
    light.position.set(20,40,10);
    scene.add(light);

    createMap();
    createPlayer();
    setupEnemies();
    loadSoldier();

    updateCamera();
    hud();
    animate();

    statusEl.textContent='Game ready. Press PLAY GAME.';
  }catch(error){
    console.error(error);
    statusEl.textContent='3D engine error: '+error.message+
      '. Internet check karo aur page refresh karo.';
  }
}

window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

init();
</script>
</body>
  </html>
